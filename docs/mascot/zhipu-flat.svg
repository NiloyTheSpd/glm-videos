<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-labelledby="t d">
  <title id="t">Zhipu — the GLM-Videos mascot, flat 2D master</title>
  <desc id="d">The Z.ai logo tile come to life: a charcoal rounded-square body with white eyes and smile, a white Z emblem on the chest, a signal-blue antenna and deep-blue feet. Original design of the GLM-Videos project.</desc>
  <!-- Zhipu mascot kit · flat 2D master · Z.ai brand palette:
       charcoal #2D2D2D · white #FFFFFF · signal blue #1F63EC · deep blue #1849C8
       Multi-style guide: docs/mascot/MASCOT.md · Original design, MIT licence. -->
  <defs>
    <!-- the Z emblem, traced from the official Z.ai mark (white strokes) -->
    <g id="zmark">
      <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
      <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="130" cy="282" rx="74" ry="11" fill="#2D2D2D" opacity=".12"/>

  <!-- antenna: signal-blue wisdom spark -->
  <circle cx="130" cy="24" r="20" fill="none" stroke="#1F63EC" stroke-opacity=".22" stroke-width="7"/>
  <rect x="126" y="34" width="8" height="36" rx="4" fill="#1849C8"/>
  <circle cx="130" cy="24" r="13" fill="#1F63EC"/>
  <circle cx="125.5" cy="19.5" r="3.5" fill="#FFFFFF"/>

  <!-- arms (charcoal stubs) -->
  <rect x="14" y="148" width="34" height="58" rx="17" fill="#2D2D2D"/>
  <rect x="212" y="148" width="34" height="58" rx="17" fill="#2D2D2D"/>

  <!-- feet (deep signal blue) -->
  <rect x="74" y="246" width="38" height="26" rx="11" fill="#1849C8"/>
  <rect x="148" y="246" width="38" height="26" rx="11" fill="#1849C8"/>

  <!-- the tile: the Z.ai logo square, come to life -->
  <rect x="40" y="66" width="180" height="182" rx="26" fill="#2D2D2D"/>

  <!-- face: white glowing eyes + smile -->
  <rect x="74" y="104" width="34" height="44" rx="15" fill="#FFFFFF"/>
  <rect x="152" y="104" width="34" height="44" rx="15" fill="#FFFFFF"/>
  <rect x="85" y="118" width="12" height="20" rx="6" fill="#1F63EC"/>
  <rect x="163" y="118" width="12" height="20" rx="6" fill="#1F63EC"/>
  <path d="M106 168 Q130 184 154 168" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- chest: the Z emblem -->
  <use href="#zmark" transform="translate(85,170.7) scale(3)" fill="#FFFFFF"/>
</svg>
