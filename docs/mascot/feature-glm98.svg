<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">GLM-Videos 98 — 98 Years of Best Picture</title>
  <desc id="d">Zhipu, the GLM-Videos mascot, in the Z.ai brand palette: charcoal tile, white face and Z emblem, signal-blue antenna and feet. Original design of the GLM-Videos project.</desc>
  <defs>
    <!-- the Z emblem, traced from the official Z.ai mark (white strokes) -->
    <g id="zmark">
      <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
      <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
    </g>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F63EC" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#1F63EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14121A"/>
      <stop offset="100%" stop-color="#08070C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- the 98 best-picture frames, as a faint mosaic behind -->
  <g opacity=".16" fill="#FFFFFF">
    <rect x="40" y="70" width="110" height="74" rx="4"/><rect x="162" y="70" width="110" height="74" rx="4"/>
    <rect x="284" y="70" width="110" height="74" rx="4"/><rect x="406" y="70" width="110" height="74" rx="4"/>
    <rect x="528" y="70" width="110" height="74" rx="4"/><rect x="650" y="70" width="110" height="74" rx="4"/>
    <rect x="772" y="70" width="110" height="74" rx="4"/><rect x="894" y="70" width="110" height="74" rx="4"/>
    <rect x="1016" y="70" width="110" height="74" rx="4"/><rect x="1138" y="70" width="110" height="74" rx="4"/>
    <rect x="1260" y="70" width="110" height="74" rx="4"/><rect x="1382" y="70" width="110" height="74" rx="4"/>
    <rect x="40" y="756" width="110" height="74" rx="4"/><rect x="162" y="756" width="110" height="74" rx="4"/>
    <rect x="284" y="756" width="110" height="74" rx="4"/><rect x="406" y="756" width="110" height="74" rx="4"/>
    <rect x="528" y="756" width="110" height="74" rx="4"/><rect x="650" y="756" width="110" height="74" rx="4"/>
    <rect x="1138" y="756" width="110" height="74" rx="4"/><rect x="1260" y="756" width="110" height="74" rx="4"/>
    <rect x="1382" y="756" width="110" height="74" rx="4"/>
  </g>

  <!-- spotlight on the mascot -->
  <ellipse cx="800" cy="430" rx="430" ry="330" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="800" cy="640" rx="185" ry="26" fill="#000000" opacity=".45"/>

  <!-- antenna: signal-blue wisdom spark -->
  <circle cx="800" cy="138" r="34" fill="none" stroke="#1F63EC" stroke-opacity=".3" stroke-width="10"/>
  <rect x="794" y="154" width="12" height="52" rx="6" fill="#1849C8"/>
  <circle cx="800" cy="136" r="22" fill="#1F63EC"/>
  <circle cx="792" cy="128" r="6" fill="#FFFFFF"/>

  <!-- arms -->
  <rect x="620" y="322" width="52" height="92" rx="26" fill="#2D2D2D"/>
  <rect x="928" y="322" width="52" height="92" rx="26" fill="#2D2D2D"/>

  <!-- feet -->
  <rect x="700" y="590" width="60" height="42" rx="18" fill="#1849C8"/>
  <rect x="840" y="590" width="60" height="42" rx="18" fill="#1849C8"/>

  <!-- the tile: the Z.ai logo square, come to life -->
  <rect x="664" y="196" width="272" height="396" rx="40" fill="#2D2D2D"/>

  <!-- face: white glowing eyes + smile -->
  <rect x="714" y="258" width="50" height="66" rx="23" fill="#FFFFFF"/>
  <rect x="836" y="258" width="50" height="66" rx="23" fill="#FFFFFF"/>
  <rect x="730" y="279" width="18" height="30" rx="9" fill="#1F63EC"/>
  <rect x="852" y="279" width="18" height="30" rx="9" fill="#1F63EC"/>
  <path d="M760 360 Q800 386 840 360" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <!-- chest: the Z emblem -->
  <use href="#zmark" transform="translate(733,374) scale(4.6)" fill="#FFFFFF"/>

  <!-- title -->
  <text x="800" y="726" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="66" fill="#FFFFFF" letter-spacing="2">GLM-Videos 98</text>
  <text x="800" y="766" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="21" fill="#9B93A8" letter-spacing="7">98 YEARS OF BEST PICTURE · 1927–2025</text>
</svg>
