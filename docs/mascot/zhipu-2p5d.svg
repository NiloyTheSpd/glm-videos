<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-labelledby="t d">
  <title id="t">Zhipu — the GLM-Videos mascot, 2.5D shaded version</title>
  <desc id="d">The same Zhipu design with soft dimensional shading: top-lit charcoal tile, glowing blue antenna orb with specular highlight, rim light and a soft ground shadow. Original design of the GLM-Videos project.</desc>
  <!-- Zhipu mascot kit · 2.5D (soft-dimension) variant · same geometry as zhipu-flat.svg
       with gradients, rim light and soft shadows. Palette: Z.ai brand trio.
       Multi-style guide: docs/mascot/MASCOT.md · Original design, MIT licence. -->
  <defs>
    <g id="zmark">
      <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
      <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
    </g>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4A"/><stop offset=".42" stop-color="#2D2D2D"/><stop offset="1" stop-color="#1B1B1B"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3C3C"/><stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A5DE8"/><stop offset="1" stop-color="#163E9E"/>
    </linearGradient>
    <radialGradient id="knobGrad" cx=".5" cy=".5" r=".65" fx=".35" fy=".3">
      <stop offset="0" stop-color="#A9C4FA"/><stop offset=".55" stop-color="#1F63EC"/><stop offset="1" stop-color="#1747AE"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1F63EC" stop-opacity=".38"/><stop offset="1" stop-color="#1F63EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDDDDD"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3D3D3"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2D2D2D" stop-opacity=".22"/><stop offset=".7" stop-color="#2D2D2D" stop-opacity=".1"/><stop offset="1" stop-color="#2D2D2D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="zlift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="130" cy="282" rx="84" ry="14" fill="url(#shadowGrad)"/>

  <!-- antenna: glowing wisdom spark -->
  <circle cx="130" cy="24" r="26" fill="url(#haloGrad)"/>
  <circle cx="130" cy="24" r="21" fill="none" stroke="#1F63EC" stroke-opacity=".25" stroke-width="6" filter="url(#soft)"/>
  <rect x="126" y="34" width="8" height="36" rx="4" fill="url(#footGrad)"/>
  <circle cx="130" cy="24" r="13" fill="url(#knobGrad)"/>
  <ellipse cx="125.5" cy="19.5" rx="4.5" ry="3.5" fill="#FFFFFF" opacity=".9"/>

  <!-- arms -->
  <rect x="14" y="148" width="34" height="58" rx="17" fill="url(#armGrad)"/>
  <rect x="212" y="148" width="34" height="58" rx="17" fill="url(#armGrad)"/>

  <!-- feet -->
  <rect x="74" y="246" width="38" height="26" rx="11" fill="url(#footGrad)"/>
  <rect x="148" y="246" width="38" height="26" rx="11" fill="url(#footGrad)"/>

  <!-- the tile -->
  <rect x="40" y="66" width="180" height="182" rx="26" fill="url(#bodyGrad)"/>
  <!-- rim light (top) + blue kick light (left) + core shadow (right) -->
  <path d="M70,74 Q130,62 190,74" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
  <path d="M54,96 Q47,160 58,224" fill="none" stroke="#257AF1" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
  <path d="M206,96 Q213,160 202,224" fill="none" stroke="#000000" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/>

  <!-- face -->
  <rect x="74" y="104" width="34" height="44" rx="15" fill="url(#eyeGrad)"/>
  <rect x="152" y="104" width="34" height="44" rx="15" fill="url(#eyeGrad)"/>
  <rect x="85" y="118" width="12" height="20" rx="6" fill="#1F63EC"/>
  <rect x="163" y="118" width="12" height="20" rx="6" fill="#1F63EC"/>
  <circle cx="88.5" cy="122" r="2.2" fill="#FFFFFF" opacity=".9"/>
  <circle cx="166.5" cy="122" r="2.2" fill="#FFFFFF" opacity=".9"/>
  <path d="M106 168 Q130 184 154 168" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>

  <!-- chest: the Z emblem, lifted -->
  <use href="#zmark" transform="translate(85,170.7) scale(3)" fill="url(#zGrad)" filter="url(#zlift)"/>
</svg>
